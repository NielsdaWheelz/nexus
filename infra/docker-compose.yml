services:
  db:
    image: pgvector/pgvector:pg16
    container_name: nexus-db
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus

  test-db:
    image: pgvector/pgvector:pg16
    container_name: nexus-test-db
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: test_nexus
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d test_nexus"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus
    profiles:
      - test

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus

  worker:
    build: ../backend
    container_name: nexus-worker
    command: celery -A app.celery_app worker -Q documents,embeddings -l info
    depends_on:
      - redis
      - db
    environment:
      - DATABASE_URL=postgresql+psycopg://app_user:password@db:5432/app_db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ../backend:/app
    networks:
      - nexus

  test-redis:
    image: redis:7-alpine
    container_name: nexus-test-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus
    profiles:
      - test

  test-worker:
    build: ../backend
    container_name: nexus-test-worker
    command: celery -A app.celery_app worker -Q documents,embeddings -l info
    depends_on:
      - test-redis
      - test-db
    environment:
      - DATABASE_URL=postgresql+psycopg://app_user:password@test-db:5432/test_nexus
      - REDIS_URL=redis://test-redis:6379/1
    volumes:
      - ../backend/storage:/app/storage  # Share blob storage with test process
    networks:
      - nexus
    profiles:
      - test

volumes:
  postgres_data:

networks:
  nexus:
    driver: bridge
